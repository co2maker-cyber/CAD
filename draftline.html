<title>Draftline CAD</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap">
<style>
/* Layout: drafting table — tool rail on top, full-bleed sheet, inspector at right, command line + status at bottom */
:root{
  --bg:#e9edf0; --panel:#f6f8f9; --line:#d3dade; --fg:#1a2329; --muted:#5d6a73;
  --canvas:#fbfcfc; --grid:#e6ebee; --grid-major:#d2dadf; --axis:#b9c7d0;
  --ink:#1a2329; --accent:#c2410c; --accent-soft:#fbe3d6; --hover:#dfe5e9;
  --c1:#c62828; --c2:#a86a00; --c3:#2e7d32; --c4:#00838f; --c5:#6a3fb5;
  --sans:"IBM Plex Sans KR",system-ui,-apple-system,"Malgun Gothic",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12171b; --panel:#171d22; --line:#2a333a; --fg:#e2e8ec; --muted:#8c9aa4;
  --canvas:#1c2329; --grid:#232b32; --grid-major:#2e3840; --axis:#3d4c57;
  --ink:#e6ecef; --accent:#ff9a52; --accent-soft:#3a2a1f; --hover:#232b32;
  --c1:#ff6b6b; --c2:#f2c14e; --c3:#6fcf7f; --c4:#4fd1db; --c5:#b69cff; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12171b; --panel:#171d22; --line:#2a333a; --fg:#e2e8ec; --muted:#8c9aa4;
  --canvas:#1c2329; --grid:#232b32; --grid-major:#2e3840; --axis:#3d4c57;
  --ink:#e6ecef; --accent:#ff9a52; --accent-soft:#3a2a1f; --hover:#232b32;
  --c1:#ff6b6b; --c2:#f2c14e; --c3:#6fcf7f; --c4:#4fd1db; --c5:#b69cff; color-scheme:dark}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);overflow:hidden}
.app{height:100%;display:grid;grid-template-columns:minmax(0,1fr) 280px;grid-template-rows:auto minmax(0,1fr) auto}
header{grid-column:1/-1;display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;padding-block:8px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  background:var(--panel);border-bottom:1px solid var(--line)}
.brand{font-weight:600;letter-spacing:.02em;display:flex;align-items:baseline;gap:6px}
.brand small{font-family:var(--mono);font-size:11px;color:var(--muted);font-weight:400}
.group{display:flex;gap:2px;padding:2px;background:var(--bg);border:1px solid var(--line);border-radius:6px}
.spacer{flex:1}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.tb{display:flex;align-items:center;gap:6px;height:32px;padding:0 8px;border-radius:4px;font-size:13px;color:var(--fg)}
.tb:hover{background:var(--hover)}
.tb[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent)}
.tb svg{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.tb kbd{font-family:var(--mono);font-size:10px;color:var(--muted);border:1px solid var(--line);border-radius:3px;padding:0 3px}
.tb[aria-pressed="true"] kbd{color:var(--accent);border-color:currentColor}
.tb:disabled{opacity:.4;cursor:default}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.stage{position:relative;min-width:0;min-height:0;background:var(--canvas)}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
aside{border-left:1px solid var(--line);background:var(--panel);overflow:auto;padding:14px 16px;display:flex;flex-direction:column;gap:18px;min-height:0}
aside h2{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 8px}
.fields{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 10px;align-items:center;font-size:13px}
.fields label{color:var(--muted);font-family:var(--mono);font-size:12px}
.fields input,.fields select{width:100%;box-sizing:border-box;font-family:var(--mono);font-size:13px;padding:4px 6px;border:1px solid var(--line);border-radius:4px;background:var(--canvas);color:var(--fg);font-variant-numeric:tabular-nums}
.info{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;font-size:12px}
.info dt{color:var(--muted)} .info dd{margin:0;text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
.swatches{display:flex;gap:6px;flex-wrap:wrap}
.sw{width:24px;height:24px;border-radius:50%;border:2px solid var(--panel);box-shadow:0 0 0 1px var(--line)}
.sw[aria-pressed="true"]{box-shadow:0 0 0 2px var(--accent)}
.keys{font-size:12px;color:var(--muted);display:grid;grid-template-columns:auto 1fr;gap:3px 10px}
.keys b{font-family:var(--mono);font-weight:500;color:var(--fg)}
.hint{font-size:12px;color:var(--muted);line-height:1.5;margin:0}
footer{grid-column:1/-1;display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;padding-block:6px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  background:var(--panel);border-top:1px solid var(--line);font-size:12px}
.cmd{display:flex;align-items:center;gap:8px;flex:1 1 380px;min-width:0}
#prompt{color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:0 1 auto}
#prompt.err{color:var(--c1)}
#cmd{flex:1 1 120px;min-width:80px;font-family:var(--mono);font-size:13px;padding:4px 8px;border:1px solid var(--line);border-radius:4px;background:var(--canvas);color:var(--fg)}
.toggles{display:flex;gap:4px}
.tg{font-family:var(--mono);font-size:11px;padding:3px 7px;border-radius:3px;border:1px solid var(--line);color:var(--muted)}
.tg[aria-pressed="true"]{color:var(--accent);border-color:var(--accent);background:var(--accent-soft)}
#coords{font-family:var(--mono);font-variant-numeric:tabular-nums;color:var(--fg);min-width:220px;text-align:right}
.modal{position:fixed;inset:0;background:rgb(0 0 0 / .35);display:flex;align-items:center;justify-content:center;padding:16px;z-index:20}
.sheet{background:var(--panel);border:1px solid var(--line);border-radius:8px;width:min(640px,100%);max-height:90%;display:flex;flex-direction:column;gap:10px;padding:16px;box-sizing:border-box}
.sheet h3{margin:0;font-size:15px}
.sheet textarea{flex:1;min-height:240px;font-family:var(--mono);font-size:12px;background:var(--canvas);color:var(--fg);border:1px solid var(--line);border-radius:4px;padding:8px;resize:vertical}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{height:32px;padding:0 12px;border-radius:4px;border:1px solid var(--line);font-size:13px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--canvas)}
.btn:hover{filter:brightness(1.05)}
.danger{color:var(--c1)}
.wsw{display:flex;padding:2px;background:var(--bg);border:1px solid var(--line);border-radius:6px}
.wsw button{height:30px;padding:0 12px;border-radius:4px;font-size:13px;color:var(--muted)}
.wsw button[aria-pressed="true"]{background:var(--panel);color:var(--fg);box-shadow:0 0 0 1px var(--line)}
body[data-workspace="3d"] .only2d{display:none!important}
body:not([data-workspace="3d"]) .only3d{display:none!important}
.app>aside{grid-column:2;grid-row:2}
#view3d{position:absolute;inset:0}
#view3d canvas{display:block;width:100%;height:100%;touch-action:none}
#flash3d{position:absolute;left:50%;top:12px;transform:translateX(-50%);background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:6px 12px;font-size:13px;z-index:2;max-width:calc(100% - 32px)}
.plist{display:flex;flex-direction:column;gap:2px}
.prow,.brow{display:flex;align-items:center;gap:8px;font-size:13px;padding:4px 6px;border-radius:4px;cursor:pointer}
.prow span{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--muted)}
.brow:hover,.prow:hover{background:var(--hover)}
.brow.on{background:var(--accent-soft);color:var(--accent)}
.brow .muted{margin-left:auto}
.muted{color:var(--muted);font-size:12px}
.eye{width:22px;height:22px;border-radius:4px;color:var(--muted)}
.dot{width:10px;height:10px;border-radius:50%;flex:none;box-shadow:0 0 0 1px var(--line)}
.dlg-err{color:var(--c1);font-size:12px;min-height:1em;margin:10px 0 0;line-height:1.5}
#timeline{display:flex;align-items:center;gap:4px;flex:1;min-width:0;overflow-x:auto;padding-block:2px}
.tl-label{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-right:6px;flex:none}
.chip{flex:none;height:28px;padding:0 10px;border:1px solid var(--line);border-radius:14px;font-size:12px;background:var(--canvas);white-space:nowrap}
.chip:hover{border-color:var(--accent)}
.chip.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.chip.err{border-color:var(--c1);color:var(--c1)}
.chip.sup{opacity:.5;text-decoration:line-through}
.btn:disabled{opacity:.45;cursor:default}
.shapes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px}
.shape{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 4px 6px;border:1px solid var(--line);border-radius:6px;background:var(--canvas);font-size:12px;cursor:grab}
.shape:hover{border-color:var(--accent);color:var(--accent)}
.shape svg{width:26px;height:26px;stroke:currentColor;fill:none;stroke-width:1.3;stroke-linejoin:round}
.segs{display:flex;padding:2px;background:var(--bg);border:1px solid var(--line);border-radius:6px}
.segs button{flex:1;height:28px;border-radius:4px;font-size:13px;color:var(--muted)}
.segs button[aria-pressed="true"]{background:var(--panel);color:var(--fg);box-shadow:0 0 0 1px var(--line)}
.aligns{display:grid;grid-template-columns:auto repeat(3,minmax(0,1fr));gap:4px;align-items:center;font-size:12px;color:var(--muted)}
.aligns .btn{height:28px;padding:0 4px;font-size:12px}
.sheet.xs{width:min(1180px,100%);max-height:94%}
#xsBody{overflow:auto;min-height:0;flex:1;display:flex;flex-direction:column;gap:10px}
.drawing{background:#fff;border:1px solid var(--line);border-radius:4px}
.drawing svg{display:block;width:100%;height:auto}
.xtable{border-collapse:collapse;width:100%;font-size:13px;font-variant-numeric:tabular-nums}
.xtable th,.xtable td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left}
.xtable th{color:var(--muted);font-weight:500;font-size:12px}
.xtable td.n{text-align:right;font-family:var(--mono)}
.xtable tfoot td{font-weight:600;border-bottom:0}
#xsBody textarea{min-height:300px;font-family:var(--mono);font-size:12px;background:var(--canvas);color:var(--fg);border:1px solid var(--line);border-radius:4px;padding:8px;resize:vertical;tab-size:2}
#xsBody pre{margin:0;font-family:var(--mono);font-size:12px;background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:8px;max-height:160px;overflow:auto;white-space:pre-wrap}
#xsBody pre.err{color:var(--c1)}
#xsBody img{max-width:100%;border:1px solid var(--line);border-radius:4px;align-self:center}
.legend{display:grid;grid-template-columns:auto 1fr;gap:4px 8px;font-size:12px;align-items:center;margin-top:8px}
.legend i{width:14px;height:14px;border-radius:3px;display:inline-block}
.clash{display:flex;justify-content:space-between;gap:8px;font-size:12px;padding:5px 6px;border-radius:4px;cursor:pointer}
.clash:hover{background:var(--hover)}
.clash b{font-family:var(--mono);font-weight:500;color:var(--c1)}
@media (max-width:1600px){.tb kbd{display:none}}
@media (max-width:1560px){[aria-label="수정 도구"] .tb .lbl,[aria-label="입체와 이미지"] .tb .lbl{display:none}}
@media (max-width:1300px){.brand{display:none}}
@media (max-width:2200px){body[data-workspace="3d"] .tb .lbl{display:none}}
@media (max-width:1400px){body[data-workspace="3d"] .tb{padding:0 6px}}
@media (max-width:1180px){.tb .lbl{display:none}}
@media (max-width:760px){
  .app{grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(260px,1fr) auto auto}
  .app>aside{grid-row:4;grid-column:1;border-left:0;border-top:1px solid var(--line);max-height:30vh;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  footer{grid-row:3}
  .tb .lbl{display:none} .tb kbd{display:none}
  #coords{min-width:0}
}
</style>

<div class="app">
  <header>
    <div class="brand">Draftline</div>
    <div class="wsw" role="group" aria-label="작업공간">
      <button class="ws-btn" data-wsv="2d" aria-pressed="true" title="2D 스케치">스케치</button>
      <button class="ws-btn" data-wsv="3d" aria-pressed="false" title="3D 모델">모델</button>
    </div>
    <div class="group only2d" role="toolbar" aria-label="그리기 도구" id="tools">
      <button class="tb" data-tool="select" title="선택 (V)"><svg viewBox="0 0 20 20"><path d="M5 3l11 7.5-5.2 1.3L8.2 17z"/></svg><span class="lbl">선택</span><kbd>V</kbd></button>
      <button class="tb" data-tool="line" title="선 (L)"><svg viewBox="0 0 20 20"><path d="M4 16L16 4"/><circle cx="4" cy="16" r="1.4"/><circle cx="16" cy="4" r="1.4"/></svg><span class="lbl">선</span><kbd>L</kbd></button>
      <button class="tb" data-tool="pline" title="폴리선 (P)"><svg viewBox="0 0 20 20"><path d="M3 15L7.5 5.5 12.5 12 17 4"/></svg><span class="lbl">폴리선</span><kbd>P</kbd></button>
      <button class="tb" data-tool="rect" title="사각형 (R)"><svg viewBox="0 0 20 20"><rect x="3.5" y="5.5" width="13" height="9"/></svg><span class="lbl">사각형</span><kbd>R</kbd></button>
      <button class="tb" data-tool="circle" title="원 (C)"><svg viewBox="0 0 20 20"><circle cx="10" cy="10" r="6.5"/><path d="M10 10h6.5"/></svg><span class="lbl">원</span><kbd>C</kbd></button>
      <button class="tb" data-tool="arc" title="원호 — 3점 (A)"><svg viewBox="0 0 20 20"><path d="M3.5 15a7 7 0 0113 0"/><circle cx="3.5" cy="15" r="1.3"/><circle cx="16.5" cy="15" r="1.3"/></svg><span class="lbl">원호</span><kbd>A</kbd></button>
      <button class="tb" data-tool="dim" title="치수 (D)"><svg viewBox="0 0 20 20"><path d="M3 6v10M17 6v10M3 11h14M3 11l3-2M3 11l3 2M17 11l-3-2M17 11l-3 2"/></svg><span class="lbl">치수</span><kbd>D</kbd></button>
    </div>
    <div class="group only2d" role="toolbar" aria-label="수정 도구">
      <button class="tb" data-tool="offset" title="오프셋 (O)"><svg viewBox="0 0 20 20"><path d="M3 13L13 3"/><path d="M7 17L17 7" stroke-dasharray="2 2"/></svg><span class="lbl">오프셋</span><kbd>O</kbd></button>
      <button class="tb" data-tool="trim" title="자르기 (T)"><svg viewBox="0 0 20 20"><path d="M10 3v14"/><path d="M3 10h5"/><path d="M12 10h5" stroke-dasharray="2 2"/></svg><span class="lbl">자르기</span><kbd>T</kbd></button>
      <button class="tb" data-tool="fillet" title="모깎기 (F)"><svg viewBox="0 0 20 20"><path d="M4 17V10a6 6 0 016-6h7"/></svg><span class="lbl">모깎기</span><kbd>F</kbd></button>
    </div>
    <div class="group only2d" role="toolbar" aria-label="입체와 이미지">
      <button class="tb" id="bExtrude" title="고른 닫힌 도형을 3D로 돌출 (E) — 고른 게 없으면 전체"><svg viewBox="0 0 20 20"><path d="M4 15h9l3-3H7z"/><path d="M10 12V3M7 6l3-3 3 3"/></svg><span class="lbl">3D 돌출</span><kbd>E</kbd></button>
      <button class="tb" id="bImage" title="참고 이미지 넣기 — 밑그림으로 깔고 따라 그리기"><svg viewBox="0 0 20 20"><rect x="3" y="4" width="14" height="12" rx="1"/><circle cx="7.5" cy="8.5" r="1.5"/><path d="M3 14l4-4 3 3 3-3 4 4"/></svg><span class="lbl">이미지</span></button>
    </div>
    <div class="group only2d">
      <button class="tb" id="bUndo" title="실행 취소 (Ctrl+Z)"><svg viewBox="0 0 20 20"><path d="M7 5L3 9l4 4"/><path d="M3 9h9a5 5 0 010 10H9"/></svg></button>
      <button class="tb" id="bRedo" title="다시 실행 (Ctrl+Y)"><svg viewBox="0 0 20 20"><path d="M13 5l4 4-4 4"/><path d="M17 9H8a5 5 0 000 10h3"/></svg></button>
      <button class="tb" id="bDel" title="삭제 (Delete)"><svg viewBox="0 0 20 20"><path d="M4 6h12M8 6V4h4v2M6 6l1 11h6l1-11"/></svg></button>
      <button class="tb" id="bFit" title="전체 보기 (Z)"><svg viewBox="0 0 20 20"><path d="M3 7V3h4M13 3h4v4M17 13v4h-4M7 17H3v-4"/></svg></button>
    </div>
    <div class="group only3d" role="toolbar" aria-label="만들기">
      <button class="tb" data-cmd3d="extrude" title="돌출 (E)"><svg viewBox="0 0 20 20"><path d="M4 15h9l3-3H7z"/><path d="M10 12V3M7 6l3-3 3 3"/></svg><span class="lbl">돌출</span></button>
      <button class="tb" data-cmd3d="revolve" title="회전"><svg viewBox="0 0 20 20"><path d="M10 2v16" stroke-dasharray="2 2"/><path d="M15 6a5 2 0 11-10 0M15 14a5 2 0 11-10 0M5 6v8M15 6v8"/></svg><span class="lbl">회전</span></button>
      <button class="tb" data-cmd3d="box" title="상자"><svg viewBox="0 0 20 20"><path d="M3 7l7-4 7 4v7l-7 4-7-4z"/><path d="M3 7l7 4 7-4M10 11v7"/></svg><span class="lbl">상자</span></button>
      <button class="tb" data-cmd3d="cylinder" title="원통"><svg viewBox="0 0 20 20"><ellipse cx="10" cy="5" rx="6" ry="2.2"/><path d="M4 5v10c0 1.2 2.7 2.2 6 2.2s6-1 6-2.2V5"/></svg><span class="lbl">원통</span></button>
      <button class="tb" data-cmd3d="sphere" title="구"><svg viewBox="0 0 20 20"><circle cx="10" cy="10" r="7"/><ellipse cx="10" cy="10" rx="7" ry="2.5"/></svg><span class="lbl">구</span></button>
      <button class="tb" data-cmd3d="cone" title="원뿔"><svg viewBox="0 0 20 20"><path d="M10 3L4 15M10 3l6 12"/><ellipse cx="10" cy="15" rx="6" ry="2"/></svg><span class="lbl">원뿔</span></button>
      <button class="tb" data-cmd3d="torus" title="토러스"><svg viewBox="0 0 20 20"><ellipse cx="10" cy="10" rx="7.5" ry="4.5"/><ellipse cx="10" cy="9.5" rx="3" ry="1.4"/></svg><span class="lbl">토러스</span></button>
    </div>
    <div class="group only3d" role="toolbar" aria-label="수정">
      <button class="tb" data-cmd3d="boolean" title="결합 — 더하기·빼기·교차"><svg viewBox="0 0 20 20"><circle cx="8" cy="10" r="5"/><circle cx="12" cy="10" r="5"/></svg><span class="lbl">결합</span></button>
      <button class="tb" data-cmd3d="move" title="이동·회전"><svg viewBox="0 0 20 20"><path d="M10 2v16M2 10h16M10 2l-2 2M10 2l2 2M10 18l-2-2M10 18l2-2M2 10l2-2M2 10l2 2M18 10l-2-2M18 10l-2 2"/></svg><span class="lbl">이동</span></button>
      <button class="tb" data-cmd3d="pattern" title="패턴 — 배열 복사"><svg viewBox="0 0 20 20"><rect x="3" y="3" width="5" height="5"/><rect x="12" y="3" width="5" height="5"/><rect x="3" y="12" width="5" height="5"/><rect x="12" y="12" width="5" height="5"/></svg><span class="lbl">패턴</span></button>

<script>
(()=>{
const $=s=>document.querySelector(s);
const cv=$('#cv'), ctx=cv.getContext('2d'), stage=$('#stage'), cmd=$('#cmd');
const COLORS=[{k:'ink',dxf:7,n:'기본'},{k:'c1',dxf:1,n:'빨강'},{k:'c2',dxf:2,n:'노랑'},{k:'c3',dxf:3,n:'초록'},{k:'c4',dxf:4,n:'청록'},{k:'c5',dxf:6,n:'보라'}];
const TOOLNAMES={select:'선택',line:'선',pline:'폴리선',rect:'사각형',circle:'원',arc:'원호',dim:'치수',offset:'오프셋',trim:'자르기',fillet:'모깎기'};
const PICK=new Set(['offset','trim','fillet']);
const KEY='draftline.v1';

let W=0,H=0,dpr=1, viewReady=false;
let ents=[], nextId=1, sel=new Set(), hoverId=null;
let tool='select', curColor=0;
let view={s:3,ox:0,oy:0};
let opts={grid:true,snap:true,ortho:false,osnap:true,step:5,offDist:10,filletR:5};
let draft=null, drag=null;
let mouse={sx:0,sy:0,in:false};
let cur={x:0,y:0}, snapHit=null;
let undoStack=[], redoStack=[];
let spaceDown=false, shiftDown=false;
let T={}; // theme colors

// ---------- geometry ----------
const P=(x,y)=>({x,y});
const add=(a,b)=>P(a.x+b.x,a.y+b.y), sub=(a,b)=>P(a.x-b.x,a.y-b.y), mul=(a,k)=>P(a.x*k,a.y*k);
const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y), mid=(a,b)=>P((a.x+b.x)/2,(a.y+b.y)/2), dot=(a,b)=>a.x*b.x+a.y*b.y;
const clone=o=>JSON.parse(JSON.stringify(o));
function segDist(p,a,b){const d=sub(b,a),L2=dot(d,d);let t=L2?dot(sub(p,a),d)/L2:0;t=Math.max(0,Math.min(1,t));return dist(p,add(a,mul(d,t)));}
const fmt=v=>{const r=Math.round(v*100)/100;return String(Object.is(r,-0)?0:r);};
const f2=v=>(Math.abs(v)<0.005?0:v).toFixed(2);
const deg=r=>r*180/Math.PI;

const TAU=Math.PI*2,norm=a=>((a%TAU)+TAU)%TAU,ang=(c,p)=>Math.atan2(p.y-c.y,p.x-c.x);
const unit=v=>{const L=Math.hypot(v.x,v.y);return L<1e-12?null:P(v.x/L,v.y/L);};
const polar=(c,r,a)=>P(c.x+r*Math.cos(a),c.y+r*Math.sin(a));
const arcSweep=e=>{const s=norm(e.a1-e.a0);return s<1e-9?TAU:s;};
const arcPts=e=>[polar(e.c,e.r,e.a0),polar(e.c,e.r,e.a0+arcSweep(e)/2),polar(e.c,e.r,e.a1)];
const onArc=(e,a)=>norm(a-e.a0)<=arcSweep(e)+1e-9;
function arcFrom3(p1,p2,p3){
  const d=2*(p1.x*(p2.y-p3.y)+p2.x*(p3.y-p1.y)+p3.x*(p1.y-p2.y));if(Math.abs(d)<1e-9||dist(p1,p3)<1e-9)return null;
  const a2=dot(p1,p1),b2=dot(p2,p2),c2=dot(p3,p3);
  const c=P((a2*(p2.y-p3.y)+b2*(p3.y-p1.y)+c2*(p1.y-p2.y))/d,(a2*(p3.x-p2.x)+b2*(p1.x-p3.x)+c2*(p2.x-p1.x))/d);

}
function lineX(a,b,c,d){const r=sub(b,a),s=sub(d,c),den=r.x*s.y-r.y*s.x;if(Math.abs(den)<1e-12)return null;return add(a,mul(r,((c.x-a.x)*s.y-(c.y-a.y)*s.x)/den));}
function segXt(a,b,c,d){const r=sub(b,a),s=sub(d,c),den=r.x*s.y-r.y*s.x;if(Math.abs(den)<1e-12)return null;const q=sub(c,a),t=(q.x*s.y-q.y*s.x)/den,u=(q.x*r.y-q.y*r.x)/den;return t>=-1e-9&&t<=1+1e-9&&u>=-1e-9&&u<=1+1e-9?t:null;}
function lineCircT(a,b,c,R){const r=sub(b,a),f=sub(a,c),A=dot(r,r),B=2*dot(f,r),C=dot(f,f)-R*R,D=B*B-4*A*C;if(A<1e-18||D<0)return [];const q=Math.sqrt(D);return q<1e-12?[-B/(2*A)]:[(-B-q)/(2*A),(-B+q)/(2*A)];}
function circX(c1,r1,c2,r2){const d=dist(c1,c2);if(d<1e-12||d>r1+r2+1e-9||d<Math.abs(r1-r2)-1e-9)return [];const a=(r1*r1-r2*r2+d*d)/(2*d),h=Math.sqrt(Math.max(0,r1*r1-a*a)),m=add(c1,mul(sub(c2,c1),a/d)),o=P(-(c2.y-c1.y)*h/d,(c2.x-c1.x)*h/d);return h<1e-9?[m]:[add(m,o),sub(m,o)];}
function rectPts(e){return [P(e.a.x,e.a.y),P(e.b.x,e.a.y),P(e.b.x,e.b.y),P(e.a.x,e.b.y)];}
function dimGeo(e){const d=sub(e.b,e.a),L=Math.hypot(d.x,d.y)||1e-9,u=P(d.x/L,d.y/L),n=P(-u.y,u.x);
  return {u,n,L,a2:add(e.a,mul(n,e.off)),b2:add(e.b,mul(n,e.off))};}
function dimOffFor(a,b,p){const d=sub(b,a),L=Math.hypot(d.x,d.y)||1e-9;return dot(sub(p,a),P(-d.y/L,d.x/L));}
function segsOf(e){
  switch(e.type){
    case 'line':return [[e.a,e.b]];
    case 'rect':{const c=rectPts(e);return c.map((p,i)=>[p,c[(i+1)%4]]);}
    case 'pline':{const s=[];for(let i=0;i<e.pts.length-1;i++)s.push([e.pts[i],e.pts[i+1]]);if(e.closed&&e.pts.length>2)s.push([e.pts[e.pts.length-1],e.pts[0]]);return s;}
    case 'dim':{const g=dimGeo(e);return [[g.a2,g.b2],[e.a,g.a2],[e.b,g.b2]];}
  }return [];
}
function pointsOf(e){return (e.type==='circle'||e.type==='arc')?[e.c]:e.type==='pline'?e.pts:[e.a,e.b];}
function snapsOf(e){
  if(e.type==='circle')return [{p:e.c,t:'cen'},{p:P(e.c.x+e.r,e.c.y),t:'qua'},{p:P(e.c.x-e.r,e.c.y),t:'qua'},{p:P(e.c.x,e.c.y+e.r),t:'qua'},{p:P(e.c.x,e.c.y-e.r),t:'qua'}];
  if(e.type==='dim')return [{p:e.a,t:'end'},{p:e.b,t:'end'}];
  if(e.type==='arc'){const [a,m,b]=arcPts(e);return [{p:a,t:'end'},{p:m,t:'mid'},{p:b,t:'end'},{p:e.c,t:'cen'}];}

function distTo(e,p){

  if(e.type==='arc'){if(onArc(e,ang(e.c,p)))return Math.abs(dist(e.c,p)-e.r);const [a,,b]=arcPts(e);return Math.min(dist(p,a),dist(p,b));}

  return m;
}
function bboxOf(e){
  if(e.type==='circle')return {x0:e.c.x-e.r,y0:e.c.y-e.r,x1:e.c.x+e.r,y1:e.c.y+e.r};

}
function moveEnt(e,d){for(const p of pointsOf(e)){p.x+=d.x;p.y+=d.y;}}
function lengthOf(e){if(e.type==='arc')return e.r*arcSweep(e);if(e.type==='circle')return TAU*e.r;return segsOf(e).reduce((s,[a,b])=>s+dist(a,b),0);}
function polyArea(pts){let s=0;for(let i=0;i<pts.length;i++){const a=pts[i],b=pts[(i+1)%pts.length];s+=a.x*b.y-b.x*a.y;}return Math.abs(s)/2;}

function gripsOf(e){
  switch(e.type){
    case 'line':return [{p:e.a,set:(e,p)=>{e.a=p}},{p:e.b,set:(e,p)=>{e.b=p}},{p:mid(e.a,e.b),set:(e,p)=>moveEnt(e,sub(p,mid(e.a,e.b)))}];

    case 'rect':{const c=rectPts(e);return [
      {p:c[0],set:(e,p)=>{e.a=p}},{p:c[1],set:(e,p)=>{e.a.y=p.y;e.b.x=p.x}},
      {p:c[2],set:(e,p)=>{e.b=p}},{p:c[3],set:(e,p)=>{e.a.x=p.x;e.b.y=p.y}},
      {p:mid(e.a,e.b),set:(e,p)=>moveEnt(e,sub(p,mid(e.a,e.b)))}];}
    case 'circle':return [{p:e.c,set:(e,p)=>{e.c=p}},...snapsOf(e).slice(1).map(s=>({p:s.p,set:(e,p)=>{e.r=Math.max(1e-3,dist(e.c,p))}}))];

    case 'dim':{const g=dimGeo(e);return [{p:e.a,set:(e,p)=>{e.a=p}},{p:e.b,set:(e,p)=>{e.b=p}},{p:mid(g.a2,g.b2),set:(e,p)=>{e.off=dimOffFor(e.a,e.b,p)}}];}

// ---------- view ----------
const w2s=p=>P(view.ox+p.x*view.s,view.oy-p.y*view.s);
const s2w=(x,y)=>P((x-view.ox)/view.s,(view.oy-y)/view.s);
function zoomAt(sx,sy,f){const w=s2w(sx,sy);view.s=Math.max(0.02,Math.min(400,view.s*f));view.ox=sx-w.x*view.s;view.oy=sy+w.y*view.s;}
function fit(){
  if(!W||!H)return;
  let b=null;for(const e of ents){const q=bboxOf(e);b=b?{x0:Math.min(b.x0,q.x0),y0:Math.min(b.y0,q.y0),x1:Math.max(b.x1,q.x1),y1:Math.max(b.y1,q.y1)}:q;}
  if(!b)b={x0:-50,y0:-50,x1:150,y1:100};

    for(let i=0;i<gs.length;i++){const q=w2s(gs[i].p);if(Math.abs(q.x-mouse.sx)<=7&&Math.abs(q.y-mouse.sy)<=7){

function segBoxHit(p,q,a,b){

  const cr=(o,u,v)=>(u.x-o.x)*(v.y-o.y)-(u.y-o.y)*(v.x-o.x);

addEventListener('keydown',ev=>{
  const inField=ev.target.matches&&ev.target.matches('input,textarea,select');
  if(!$('#modal').hidden){if(ev.key==='Escape')closeModal();return;}
  if(document.body.dataset.workspace==='3d')return;
  if(ev.key==='Shift'&&!shiftDown){shiftDown=true;if(mouse.in){computeCursor();render();}}
  if(inField)return;
  const k=ev.key,mod=ev.ctrlKey||ev.metaKey;
  if(k===' '){ev.preventDefault();if(draft){endDraft();return;}spaceDown=true;updateCursorStyle();return;}
  if(mod){const l=k.toLowerCase();
    if(l==='z'){ev.preventDefault();ev.shiftKey?redo():undo();}
    else if(l==='y'){ev.preventDefault();redo();}
    else if(l==='a'){ev.preventDefault();setTool('select');sel=new Set(ents.map(e=>e.id));updatePanel();render();}
    else if(l==='d'){ev.preventDefault();dupSel();}
    return;}
  if(k==='Escape'){escape();return;}
  if(k==='Delete'||k==='Backspace'){ev.preventDefault();delSel();return;}
  if(k==='Enter'){exec('');return;}
  const fk={F3:'osnap',F7:'grid',F8:'ortho',F9:'snap'}[k];if(fk){ev.preventDefault();toggleOpt(fk);return;}
  if(/^[0-9@.\-]$/.test(k)&&tool!=='select'){ev.preventDefault();cmd.focus();cmd.value+=k;return;}
  const sc={v:'select',l:'line',p:'pline',r:'rect',c:'circle',a:'arc',d:'dim',o:'offset',t:'trim',f:'fillet'}[k.toLowerCase()];
  if(sc&&!ev.altKey){setTool(sc);return;}
  if(k.toLowerCase()==='z')fit();

  if(k.toLowerCase()==='e'){ev.stopImmediatePropagation();extrudeSketch();return;}
});

function toDXF(){

  g(0,'SECTION');g(2,'HEADER');g(9,'$ACADVER');g(1,'AC1009');g(9,'$INSUNITS');g(70,4);g(0,'ENDSEC');
  g(0,'SECTION');g(2,'ENTITIES');
  const L=(a,b,c,layer)=>{g(0,'LINE');g(8,layer||'0');g(62,c);g(10,a.x);g(20,a.y);g(30,0);g(11,b.x);g(21,b.y);g(31,0);};
  for(const e of ents){const c=COLORS[e.color].dxf;
    if(e.type==='circle'){g(0,'CIRCLE');g(8,'0');g(62,c);g(10,e.c.x);g(20,e.c.y);g(30,0);g(40,e.r);}
    else if(e.type==='arc'){g(0,'ARC');g(8,'0');g(62,c);g(10,e.c.x);g(20,e.c.y);g(30,0);g(40,e.r);g(50,deg(e.a0));g(51,deg(e.a1));}
    else if(e.type==='dim'){const gm=dimGeo(e),sg=Math.sign(e.off)||1;for(const [a,b] of segsOf(e).slice(1).map(([a,b])=>[add(a,mul(gm.n,sg)),add(b,mul(gm.n,sg*1.5))]))if(Math.abs(e.off)>1)L(a,b,c,'DIM');
      L(gm.a2,gm.b2,c,'DIM');
      const ah=Math.min(2.5,gm.L/3),aw=ah*.32;for(const [t,d] of [[gm.a2,gm.u],[gm.b2,mul(gm.u,-1)]]){const bb=add(t,mul(d,ah));L(t,add(bb,mul(gm.n,aw)),c,'DIM');L(t,add(bb,mul(gm.n,-aw)),c,'DIM');}
      let ang=deg(Math.atan2(gm.u.y,gm.u.x));if(ang>90.0001)ang-=180;if(ang<=-90)ang+=180;const tp=add(mid(gm.a2,gm.b2),mul(gm.n,sg*2.3));
      g(0,'TEXT');g(8,'DIM');g(62,c);g(10,tp.x);g(20,tp.y);g(30,0);g(40,3);g(1,fmt(gm.L));g(50,ang);g(72,1);g(73,2);g(11,tp.x);g(21,tp.y);g(31,0);}
    else for(const [a,b] of segsOf(e))L(a,b,c);
  }

}

function copyText(){const t=$('#mText');const done=()=>{$('#mAct').textContent='복사됨';setTimeout(()=>$('#mAct').textContent='복사',1500);};
  try{navigator.clipboard.writeText(t.value).then(done,()=>{t.select();$('#mAct').textContent='Ctrl+C로 복사하세요';});}catch(_){t.select();$('#mAct').textContent='Ctrl+C로 복사하세요';}}
$('#bDxf').onclick=()=>openModal('DXF 내보내기','AutoCAD R12 형식입니다. 복사해서 .dxf 파일로 저장하면 AutoCAD, LibreCAD, FreeCAD 등에서 열 수 있습니다.',toDXF(),'복사',copyText,false,'draftline.dxf');
$('#bJson').onclick=()=>openModal('JSON 저장','스케치와 3D 모델 전체 데이터입니다. 복사해서 .json 파일로 보관했다가 [불러오기]로 다시 열 수 있습니다.',JSON.stringify({app:'draftline',version:2,ents,model:getModel()},null,1),'복사',copyText,false,'draftline.json');
$('#bOpen').onclick=()=>openModal('불러오기','JSON 내용을 붙여넣거나 파일을 선택하세요. 현재 도면은 바뀌지만 Ctrl+Z로 되돌릴 수 있습니다.','','불러오기',()=>{
  let d;try{d=JSON.parse($('#mText').value);}catch(_){$('#mHint').textContent='JSON 형식이 올바르지 않습니다. 내용을 확인해 주세요.';return;}
  const list=sanitize(Array.isArray(d)?d:d&&d.ents);if(!list.length){$('#mHint').textContent='불러올 수 있는 객체가 없습니다.';return;}
  checkpoint();ents=list;nextId=list.reduce((m,e)=>Math.max(m,e.id),0)+1;sel.clear();draft=null;closeModal();changed();fit();if(d&&d.model)setModel(d.model);updatePrompt(`${list.length}개 객체를 불러왔습니다`);
},true);
$('#mPick').onclick=()=>$('#mFile').click();
$('#mFile').onchange=()=>{const f=$('#mFile').files[0];if(!f)return;const r=new FileReader();r.onload=()=>{$('#mText').value=r.result;};r.readAsText(f);$('#mFile').value='';};
$('#mDl').onclick=()=>{const u=URL.createObjectURL(new Blob([$('#mText').value],{type:'text/plain'}));const a=document.createElement('a');a.href=u;a.download=dlName;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),1000);};
$('#mClose').onclick=closeModal;$('#mAct').onclick=()=>modalAct&&modalAct();
$('#modal').addEventListener('pointerdown',ev=>{if(ev.target.id==='modal')closeModal();});

// ---------- workspace & 3D bridge ----------
const MODEL_KEY='draftline.model.v1';
function getModel(){if(window.Draftline3D)return window.Draftline3D.getState();try{return JSON.parse(localStorage.getItem(MODEL_KEY)||'null');}catch(_){return null;}}
function setModel(m){if(window.Draftline3D)window.Draftline3D.setState(m);else{try{localStorage.setItem(MODEL_KEY,JSON.stringify(m&&Array.isArray(m.features)?m:{features:[],nextFid:1,props:{}}));}catch(_){}}}
// ---------- reference image ----------
const IMG_KEY='draftline.img';
let refImg=null,refEl=null;
function setRefEl(){refEl=new Image();refEl.onload=()=>{render();notifyImg();};refEl.src=refImg.src;}
function saveRefImg(){try{if(refImg)localStorage.setItem(IMG_KEY,JSON.stringify(refImg));else localStorage.removeItem(IMG_KEY);}catch(_){updatePrompt('이미지가 커서 브라우저에 저장하지 못했습니다 — 이번 화면에서만 보입니다',true);}}
function notifyImg(){if(window.Draftline3D&&window.Draftline3D.refImageChanged)window.Draftline3D.refImageChanged();}
function importRefImage(file){
  const fr=new FileReader();
  fr.onload=()=>{const im=new Image();
    im.onload=()=>{const k=Math.min(1,1600/Math.max(im.naturalWidth,im.naturalHeight)),c=document.createElement('canvas');c.width=Math.max(1,Math.round(im.naturalWidth*k));c.height=Math.max(1,Math.round(im.naturalHeight*k));
      const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);
      const w=refImg?refImg.w:100,ctr=s2w(W/2,H/2),hh=w*c.height/c.width;
      refImg={src:c.toDataURL('image/jpeg',0.85),x:refImg?refImg.x:+(ctr.x-w/2).toFixed(1),y:refImg?refImg.y:+(ctr.y-hh/2).toFixed(1),w,op:refImg?refImg.op:0.5,show:true};
      saveRefImg();setRefEl();updatePanel();updatePrompt('이미지를 넣었습니다 — 오른쪽에서 위치·폭·투명도를 맞추세요');};
    im.onerror=()=>updatePrompt('이미지로 읽을 수 없는 파일입니다',true);im.src=fr.result;};
  fr.readAsDataURL(file);
}
$('#imgFile').onchange=()=>{const f=$('#imgFile').files[0];if(f)importRefImage(f);$('#imgFile').value='';};
$('#bImage').onclick=()=>$('#imgFile').click();
try{refImg=JSON.parse(localStorage.getItem(IMG_KEY)||'null');if(refImg&&refImg.src)setRefEl();else refImg=null;}catch(_){refImg=null;}
window.Draftline={getEnts:()=>ents,onChange:f=>listeners.push(f),arcSweep,
  getRefImage:()=>refImg&&refEl&&refEl.naturalWidth?{...refImg,h:refImg.w*refEl.naturalHeight/refEl.naturalWidth}:null,
  openText:(title,hint,text,fname)=>openModal(title,hint,text,'복사',copyText,false,fname),
  canDownload,
  // 스크립트용: 스케치에 도형 추가 / 비우기
  addEnts(list){const s=sanitize(list);if(!s.length)return [];checkpoint();const ids=[];for(const e of s){e.id=nextId++;ents.push(e);ids.push(e.id);}changed();return ids;},
  clearEnts(){if(!ents.length)return;checkpoint();ents=[];sel.clear();draft=null;changed();}};
let m3d=null;
function setWS(ws){
  document.body.dataset.workspace=ws;
  document.querySelectorAll('.ws-btn').forEach(b=>b.setAttribute('aria-pressed',b.dataset.wsv===ws));
  try{localStorage.setItem('draftline.ws',ws);}catch(_){}
  if(ws==='3d'&&!m3d){
    m3d=import('./model3d.js').catch(err=>{m3d=null;$('#panel3d').innerHTML='<section><h2>3D 엔진을 불러오지 못했습니다</h2><p class="hint">인터넷 연결을 확인한 뒤 모델 탭을 다시 눌러 주세요.</p><p class="hint"></p></section>';$('#panel3d').querySelectorAll('.hint')[1].textContent=String(err&&err.message||err);});
  }
  dispatchEvent(new CustomEvent('draftline:ws',{detail:ws}));
  if(ws==='2d'){resize();render();}
}
document.querySelectorAll('.ws-btn').forEach(b=>b.addEventListener('click',()=>setWS(b.dataset.wsv)));
// 스케치의 닫힌 도형을 3D 돌출로 (고른 것이 없으면 전체)
async function extrudeSketch(){const ids=[...sel];setWS('3d');try{await m3d;}catch(_){}if(window.Draftline3D&&window.Draftline3D.extrudeFrom)window.Draftline3D.extrudeFrom(ids);}
$('#bExtrude').onclick=extrudeSketch;

// ---------- boot ----------
function resize(){const r=stage.getBoundingClientRect();dpr=window.devicePixelRatio||1;W=r.width;H=r.height;cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);
  if(!viewReady&&W>0&&H>0){viewReady=true;fit();}render();}
new ResizeObserver(resize).observe(stage);
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',render);
new MutationObserver(render).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});
if(document.fonts)document.fonts.ready.then(render);
load();syncToggles();setTool('select');updatePanel();updateButtons();resize();
let ws0='2d';try{ws0=localStorage.getItem('draftline.ws')==='3d'?'3d':'2d';}catch(_){}setWS(ws0);
})();
</script>
